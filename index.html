<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FindSync | Campus Lost & Found Integration</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#18243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.layout{display:flex;min-height:100vh}aside{width:235px;background:#14233d;color:#fff;padding:25px 15px;flex-shrink:0}aside h1{font-size:25px;margin:0 8px 4px}aside p{color:#9fb3d0;font-size:12px;margin:0 8px 32px}.nav{display:block;width:100%;padding:13px;border:0;border-radius:9px;color:#c8d5e9;background:transparent;text-align:left;font-size:14px;cursor:pointer;margin-bottom:5px}.nav.active,.nav:hover{background:#2b4670;color:white}main{flex:1;padding:28px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h2{margin:0;font-size:26px}.muted{color:#697991;font-size:13px}.panel,.stat{background:white;border:1px solid #e2e8f2;border-radius:13px;padding:20px;box-shadow:0 4px 18px #22344c08;margin-top:17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{margin-top:18px}.stat strong{display:block;font-size:30px;margin-top:10px;color:#175bba}.stat span{color:#61718b;font-size:13px}.btn{border:0;background:#2169cf;color:white;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:600}.btn:hover{background:#1656af}.btn.alt{background:#eaf1fc;color:#2459a4}.btn.warn{background:#b55c17}.btn.danger{background:#b52c47}.btn:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #cdd7e5;border-radius:8px;padding:10px;font:inherit;background:#fff}textarea{min-height:75px}label{font-size:13px;font-weight:600;display:block;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e9eef5;font-size:13px;vertical-align:top}th{color:#64758e;background:#f8fafd}.pill{display:inline-block;border-radius:20px;background:#eaf1ff;color:#2757a4;padding:5px 9px;font-size:12px}.pill.good{background:#e6f7ee;color:#126e43}.pill.bad{background:#fff0e6;color:#a35c14}.hidden{display:none!important}.note{padding:13px;border-radius:9px;background:#edf5ff;color:#315d8c;font-size:13px;margin:12px 0}.error{background:#fff0f0;color:#9a1b34}.match{border:1px solid #e0e8f3;border-radius:10px;padding:15px;margin:12px 0}.match h4{margin:0 0 8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.tiny{font-size:12px;color:#6c7b90}.search{max-width:310px}.score{font-weight:700;color:#145bb5}footer{font-size:12px;color:#8591a4;margin-top:25px}@media(max-width:850px){aside{width:175px}.stats{grid-template-columns:repeat(2,1fr)}main{padding:16px}}@media(max-width:580px){.layout{display:block}aside{width:100%;padding:13px}aside h1{font-size:21px}aside p{margin-bottom:12px}.menu{display:flex;overflow-x:auto}.nav{min-width:max-content}.stats,.split,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="layout"><aside><h1>🔎 FindSync</h1><p>Campus Data Integration</p><div class="menu" id="menu"></div></aside><main><div class="top"><div><h2 id="heading">Dashboard</h2><div class="muted" id="subtitle">Unified campus lost & found intelligence</div></div><span class="pill">● Local demo mode</span></div><div id="view"></div><footer>FindSync • EDM Integration Prototype • Demo records are fictional • Stored in this browser only</footer></main></div><script>
'use strict';const KEY='findsync_edm_v1';const categories=['Wallet','ID Card','Keys','Electronics','Bag','Umbrella','Clothing','Other'];const locations=['Library','Cafeteria','Main Gate','Computer Laboratory','Gymnasium','Classroom','Hallway','Other'];const now=()=>new Date().toISOString().slice(0,10);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');const uid=prefix=>prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase();const seed=()=>({students:[{id:'2026-1001',name:'Ana Reyes',program:'BSIT'},{id:'2026-1002',name:'Marco Santos',program:'BSHM'},{id:'2026-1003',name:'Lia Cruz',program:'BSIT'}],lost:[{id:'L-001',studentId:'2026-1001',category:'Wallet',description:'Black leather wallet',location:'Library',date:'2026-11-19',status:'Open'}],found:[{id:'F-001',studentId:'2026-1002',category:'Wallet',description:'Black wallet with zipper',location:'Library',date:'2026-11-20',status:'Available'}],claims:[],logs:[{at:new Date().toLocaleString(),action:'DEMO INITIALIZED',details:'Fictional sample data created'}]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();let page='Dashboard';const pages=['Dashboard','Lost Reports','Found Items','Smart Matching','Claim Verification','Student Registry','ETL Import','Audit Logs'];const subtitles={'Dashboard':'Integrated overview across campus data sources','Lost Reports':'Student-reported missing items','Found Items':'Items submitted to the campus lost & found','Smart Matching':'Rule-based reconciliation of lost and found records','Claim Verification':'Staff-controlled release and claim audit','Student Registry':'Student information source for validation','ETL Import':'Extract, transform and load external CSV records','Audit Logs':'Traceability for critical data changes'};function log(action,details){db.logs.unshift({at:new Date().toLocaleString(),action,details});save()}function nav(p){page=p;document.getElementById('heading').textContent=p;document.getElementById('subtitle').textContent=subtitles[p];document.getElementById('menu').innerHTML=pages.map(x=>`<button class="nav ${x===p?'active':''}" data-nav="${esc(x)}">${esc(x)}</button>`).join('');render()}document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n)nav(n.dataset.nav)});function student(id){return db.students.find(s=>norm(s.id)===norm(id))}function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}function field(label,name,type='text',opts=[]){return `<div><label>${label}</label>${type==='select'?`<select name="${name}" required>${opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" required></textarea>`:`<input name="${name}" type="${type}" ${type==='date'?`value="${now()}"`:''} required>`}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">No records yet.</td></tr>`}</tbody></table></div>`}function render(){const v=document.getElementById('view');if(page==='Dashboard'){v.innerHTML=`<div class="stats">${stat('Lost reports',db.lost.length)}${stat('Found items',db.found.length)}${stat('Potential matches',allMatches().length)}${stat('Completed claims',db.claims.length)}</div><div class="split"><div class="panel"><h3>Integration health</h3><p>✓ Student registry connected (local source)</p><p>✓ Lost report records available</p><p>✓ Found item records available</p><p>✓ Matching rules operational</p><p>✓ Audit logging enabled</p><div class="note">Records are synchronized across modules in this browser. This is a demonstration, not a live university integration.</div></div><div class="panel"><h3>Quick demonstration</h3><p class="muted">1. Register a student → 2. File a lost report → 3. Record a found item → 4. Review matches → 5. Verify a claim.</p><div class="actions"><button class="btn" data-nav="Smart Matching">View matches</button><button class="btn alt" data-nav="ETL Import">Import CSV</button></div></div></div><div class="panel"><h3>Recent activity</h3>${table(['Timestamp','Action','Details'],db.logs.slice(0,5).map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.action)}</td><td>${esc(l.details)}</td></tr>`))}</div>`}
else if(page==='Lost Reports'||page==='Found Items'){const lost=page==='Lost Reports',arr=lost?db.lost:db.found;v.innerHTML=`<div class="panel"><h3>${lost?'Submit lost item report':'Register found item'}</h3><form id="itemForm" data-type="${lost?'lost':'found'}"><div class="formgrid">${field(lost?'Owner student ID':'Finder student ID','studentId')}${field('Item category','category','select',categories)}${field('Location','location','select',locations)}${field(lost?'Date lost':'Date found','date','date')}<div class="full">${field('Description (color, brand, distinguishing details)','description','textarea')}</div></div><div class="actions"><button class="btn">${lost?'Save lost report':'Save found item'}</button></div></form><div id="formMessage"></div></div><div class="panel"><h3>${lost?'Lost reports':'Found items'} (${arr.length})</h3><input class="search" id="filter" placeholder="Search records..."><div id="records">${itemTable(arr)}</div></div>`;document.getElementById('filter').oninput=e=>document.getElementById('records').innerHTML=itemTable(arr.filter(x=>Object.values(x).join(' ').toLowerCase().includes(e.target.value.toLowerCase())));document.getElementById('itemForm').onsubmit=submitItem}
else if(page==='Student Registry'){v.innerHTML=`<div class="panel"><h3>Add student</h3><form id="studentForm"><div class="formgrid">${field('Student ID','id')}${field('Full name','name')}${field('Program / Department','program')}</div><div class="actions"><button class="btn">Add student</button></div></form><div id="formMessage"></div></div><div class="panel"><h3>Verified student registry</h3>${table(['Student ID','Name','Program'],db.students.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.program)}</td></tr>`))}</div>`;document.getElementById('studentForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o=Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v.trim()]));if(db.students.some(s=>norm(s.id)===norm(o.id))){message('Duplicate student ID rejected',true);return}db.students.push(o);log('STUDENT CREATED',o.id+' • '+o.name);nav(page)}}
else if(page==='Smart Matching'){const matches=allMatches();v.innerHTML=`<div class="panel"><h3>Potential matches (${matches.length})</h3><div class="note">Matching score is a heuristic based on category, location, date proximity and shared description keywords. It is not identity verification or AI certainty. Staff must verify ownership.</div>${matches.length?matches.map(m=>`<div class="match"><h4>${esc(m.l.id)} ↔ ${esc(m.f.id)} <span class="score">${m.score}% similarity</span></h4><div class="split"><div><b>Lost:</b> ${esc(m.l.description)}<br><span class="tiny">${esc(m.l.location)} • ${esc(m.l.date)} • ${esc(m.l.studentId)}</span></div><div><b>Found:</b> ${esc(m.f.description)}<br><span class="tiny">${esc(m.f.location)} • ${esc(m.f.date)} • ${esc(m.f.studentId)}</span></div></div><p class="tiny">Matching factors: ${esc(m.reasons.join(', '))}</p><button class="btn" data-claim="${esc(m.l.id)}|${esc(m.f.id)}">Prepare claim verification</button></div>`).join(''):'<p class="muted">No potential matches. Add compatible lost and found records first.</p>'}</div>`;v.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const [l,f]=b.dataset.claim.split('|');nav('Claim Verification');document.getElementById('lostId').value=l;document.getElementById('foundId').value=f})}
else if(page==='Claim Verification'){v.innerHTML=`<div class="panel"><h3>Staff verification</h3><div class="note">Only process a claim after confirming ownership evidence outside this demo. The finder and owner must be registered students. Claiming updates both source records.</div><form id="claimForm"><div class="formgrid"><div><label>Lost report</label><select name="lostId" id="lostId" required>${db.lost.filter(x=>x.status==='Open').map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.description)}</option>`).join('')}</select></div><div><label>Found item</label><select name="foundId" id="foundId" required>${db.found.filter(x=>x.status==='Available').map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.description)}</option>`).join('')}</select></div><div class="full">${field('Verification notes / ownership evidence','notes','textarea')}</div></div><div class="actions"><button class="btn">Verify and release item</button></div></form><div id="formMessage"></div></div><div class="panel"><h3>Claim history</h3>${table(['Claim ID','Lost / Found','Owner','Date','Notes'],db.claims.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.lostId)} / ${esc(c.foundId)}</td><td>${esc(c.owner)}</td><td>${esc(c.date)}</td><td>${esc(c.notes)}</td></tr>`))}</div>`;document.getElementById('claimForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const l=db.lost.find(x=>x.id===o.lostId&&x.status==='Open'),f=db.found.find(x=>x.id===o.foundId&&x.status==='Available');if(!l||!f||l.category!==f.category){message('Invalid selection: records must be open, available and in the same category.',true);return}if(!o.notes.trim()){message('Verification notes are required',true);return}l.status='Resolved';f.status='Claimed';const id=uid('C');db.claims.unshift({id,lostId:l.id,foundId:f.id,owner:l.studentId,date:now(),notes:o.notes.trim()});log('CLAIM VERIFIED',`${id}: ${l.id} linked to ${f.id}; status synchronized`);nav(page)}}
else if(page==='ETL Import'){v.innerHTML=`<div class="panel"><h3>CSV data integration</h3><p class="muted">Extract from a CSV file, transform/standardize values, validate student IDs and duplicates, then load into the corresponding source table.</p><div class="note">Supported CSV columns: <code>studentId,category,description,location,date</code>. A header row is required. Import type is selected below. Dates must use YYYY-MM-DD.</div><div class="formgrid"><div><label>Source dataset</label><select id="importType"><option value="found">Found items</option><option value="lost">Lost reports</option></select></div><div><label>CSV file</label><input type="file" accept=".csv,text/csv" id="csvFile"></div></div><div class="actions"><button class="btn" id="importBtn">Validate & import</button><button class="btn alt" id="sampleBtn">Download sample CSV</button><button class="btn alt" id="exportBtn">Export unified report</button></div><div id="importResult"></div></div><div class="panel"><h3>Data quality controls</h3><p>✓ Required fields and valid dates</p><p>✓ Student registry foreign-key validation</p><p>✓ Category and location standardization</p><p>✓ Duplicate detection (same student, description, date, location)</p><p>✓ Audit trail of successful imports and rejected rows</p></div>`;document.getElementById('importBtn').onclick=importCSV;document.getElementById('sampleBtn').onclick=()=>download('findsync_sample_found.csv','studentId,category,description,location,date\n2026-1003,Keys,Silver keys with blue keychain,Library,2026-11-20\n2026-1002,Wallet,Black leather wallet,Library,2026-11-20');document.getElementById('exportBtn').onclick=exportReport}
else if(page==='Audit Logs'){v.innerHTML=`<div class="panel"><div class="top"><h3>Activity history (${db.logs.length})</h3><button class="btn alt" id="logsExport">Export logs CSV</button></div>${table(['Timestamp','Action','Details'],db.logs.map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.action)}</td><td>${esc(l.details)}</td></tr>`))}</div>`;document.getElementById('logsExport').onclick=()=>download('findsync_audit.csv',csv(['Timestamp','Action','Details'],db.logs.map(l=>[l.at,l.action,l.details])))} }
function itemTable(arr){return table(['ID','Student','Category / Description','Location','Date','Status'],arr.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.studentId)}<br><span class="tiny">${esc(student(x.studentId)?.name||'Unknown')}</span></td><td><b>${esc(x.category)}</b><br>${esc(x.description)}</td><td>${esc(x.location)}</td><td>${esc(x.date)}</td><td><span class="pill ${['Claimed','Resolved'].includes(x.status)?'good':'bad'}">${esc(x.status)}</span></td></tr>`))}function message(s,bad=false){let el=document.getElementById('formMessage');if(el)el.innerHTML=`<div class="note ${bad?'error':''}">${esc(s)}</div>`}function submitItem(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.description=o.description.trim();o.studentId=o.studentId.trim();if(!student(o.studentId)){message('Student ID not found in registry. Register the student first.',true);return}if(!validDate(o.date)){message('Invalid date',true);return}const type=e.target.dataset.type;if(duplicate(db[type],o)){message('Duplicate record detected. Nothing saved.',true);return}o.id=uid(type==='lost'?'L':'F');o.status=type==='lost'?'Open':'Available';db[type].unshift(o);log(type==='lost'?'LOST REPORT CREATED':'FOUND ITEM CREATED',o.id+' • '+o.description);nav(page)}function duplicate(arr,o){return arr.some(x=>norm(x.studentId)===norm(o.studentId)&&norm(x.description)===norm(o.description)&&x.date===o.date&&norm(x.location)===norm(o.location))}function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s}function tokens(s){return new Set(norm(s).replace(/[^a-z0-9 ]/g,' ').split(' ').filter(x=>x.length>2&&!['with','the','and','from','item'].includes(x)))}function score(l,f){if(l.category!==f.category)return null;let n=45,r=['same category'];if(norm(l.location)===norm(f.location)){n+=20;r.push('same location')}const a=tokens(l.description),b=tokens(f.description),overlap=[...a].filter(x=>b.has(x));if(overlap.length){n+=Math.min(25,overlap.length*12.5);r.push('shared keywords: '+overlap.join(', '))}const days=Math.abs((Date.parse(l.date)-Date.parse(f.date))/86400000);if(days<=7){n+=10;r.push('dates within 7 days')}return {score:Math.round(n),reasons:r}}function allMatches(){return db.lost.filter(x=>x.status==='Open').flatMap(l=>db.found.filter(f=>f.status==='Available').map(f=>{let s=score(l,f);return s?{l,f,...s}:null}).filter(Boolean)).filter(m=>m.score>=60).sort((a,b)=>b.score-a.score)}
function parseCSV(s){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Unclosed quoted field');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}function canonical(value,choices){return choices.find(c=>norm(c)===norm(value))}async function importCSV(){const file=document.getElementById('csvFile').files[0],out=document.getElementById('importResult');if(!file){out.innerHTML='<div class="note error">Select a CSV file first.</div>';return}try{const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(!rows.length)throw Error('CSV is empty');const h=rows.shift().map(norm),req=['studentid','category','description','location','date'];if(req.some(x=>!h.includes(x)))throw Error('Required headers: studentId, category, description, location, date');const type=document.getElementById('importType').value,arr=db[type],rejected=[];let added=0;rows.forEach((r,i)=>{const get=k=>(r[h.indexOf(k)]||'').trim();const o={studentId:get('studentid'),category:canonical(get('category'),categories),description:get('description').replace(/\s+/g,' '),location:canonical(get('location'),locations),date:get('date')};let why=!student(o.studentId)?'unknown student ID':!o.category?'invalid category':!o.location?'invalid location':!o.description?'missing description':!validDate(o.date)?'invalid date':duplicate(arr,o)?'duplicate record':null;if(why){rejected.push(`Row ${i+2}: ${why}`);return}o.id=uid(type==='lost'?'L':'F');o.status=type==='lost'?'Open':'Available';arr.push(o);added++});log('ETL IMPORT',`${type}: ${added} loaded, ${rejected.length} rejected`);out.innerHTML=`<div class="note">ETL completed: <b>${added} loaded</b>, <b>${rejected.length} rejected</b>.</div>${rejected.length?`<div class="note error">${rejected.map(esc).join('<br>')}</div>`:''}`}catch(e){out.innerHTML=`<div class="note error">${esc(e.message)}</div>`}}function csv(h,rows){return [h,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function download(name,contents){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([contents],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportReport(){const rows=[...db.lost.map(x=>['Lost',x.id,x.studentId,x.category,x.description,x.location,x.date,x.status]),...db.found.map(x=>['Found',x.id,x.studentId,x.category,x.description,x.location,x.date,x.status])];download('findsync_unified_report.csv',csv(['Source','Record ID','Student ID','Category','Description','Location','Date','Status'],rows));log('REPORT EXPORTED','Unified lost and found dataset')}nav('Dashboard');
</script></body></html>
